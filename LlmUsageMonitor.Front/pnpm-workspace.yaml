allowBuilds:
    esbuild: false
    msw: false
catalog:
    vite: npm:@voidzero-dev/vite-plus-core@1.1.0
    vite-plus: 1.1.0
overrides:
    vite@*: "catalog:"
# vp resolves oxfmt / oxlint from the project first: without these links, Node would walk up to the repository root
# and pick the versions of the root TypeScript tooling instead of the ones bundled with vite-plus.
publicHoistPattern:
    - oxfmt
    - oxlint
    - oxlint-tsgolint
peerDependencyRules:
    allowAny:
        - vite
    allowedVersions:
        vite: "*"
