allowBuilds:
    esbuild: false

catalog:
    vite: npm:@voidzero-dev/vite-plus-core@1.0.0
    vite-plus: 1.0.0

overrides:
    vite@*: "catalog:"

# vp resolves oxfmt / oxlint from the project first: without these links, Node would walk up to the repository root
# and pick other versions.
publicHoistPattern:
    - oxfmt
    - oxlint
    - oxlint-tsgolint

peerDependencyRules:
    allowAny:
        - vite
    allowedVersions:
        vite: "*"
